name: Fehlerbericht
description: Einen Fehler oder unerwartetes Verhalten in Bike Archiv melden
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert?
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Betriebsmodus
      options:
        - Statische Website (Browser / localStorage)
        - Node.js-Server (SQLite)
        - Entwicklung (npm run dev)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes vs. tatsächliches Verhalten
    validations:
      required: true
